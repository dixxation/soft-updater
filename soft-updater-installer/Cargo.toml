[package]
name = "soft-updater-installer"
version = "0.1.0"
edition = "2021"

[lib]
name = "soft_updater_installer"
path = "src/lib.rs"

[[bin]]
name = "soft-updater-installer"
path = "src/main.rs"

[dependencies]
zip = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
