name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '8.0.x'
  RUST_VERSION: stable
  LIB_PROJECT: soft-updater-lib/soft-updater-lib.csproj
  INSTALLER_DIR: soft-updater-installer
  RESOURCES_DIR: soft-updater-lib/Resources

jobs:
  # ── 1. Билд Rust инсталлера под оба таргета ────────────────────────────────
  build-installer:
    name: Build installer (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            output: soft-updater-installer.exe
            artifact: soft-updater-installer-win-x64.exe
          - target: x86_64-unknown-linux-gnu
            output: soft-updater-installer
            artifact: soft-updater-installer-linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.INSTALLER_DIR }}/target
          key: rust-${{ matrix.target }}-${{ hashFiles('soft-updater-installer/Cargo.toml') }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        working-directory: ${{ env.INSTALLER_DIR }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.INSTALLER_DIR }}/target/${{ matrix.target }}/release/${{ matrix.output }}
          retention-days: 1

  # ── 2. Билд и публикация .NET либы ────────────────────────────────────────
  publish-lib:
    name: Pack and publish NuGet
    runs-on: ubuntu-latest
    needs: build-installer
    permissions:
      packages: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Создаём папку для бинарников
      - name: Create Resources directory
        run: mkdir -p ${{ env.RESOURCES_DIR }}

      # Скачиваем оба бинарника из предыдущего джоба
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: soft-updater-installer-*
          path: ${{ env.RESOURCES_DIR }}
          merge-multiple: true

      - name: Make linux installer executable
        run: chmod +x ${{ env.RESOURCES_DIR }}/soft-updater-installer

      # Версия из тега (v1.2.3 → 1.2.3)
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Pack
        run: |
          dotnet pack ${{ env.LIB_PROJECT }} \
            --configuration Release \
            --output ./nupkg \
            /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./nupkg/*.nupkg
          generate_release_notes: true