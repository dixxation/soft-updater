name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '8.0.x'
  RUST_VERSION: stable
  LIB_PROJECT: SoftUpdaterLib/SoftUpdater.Lib.csproj
  INSTALLER_DIR: soft-updater-installer
  RESOURCES_DIR: SoftUpdaterLib/Resources

jobs:
  # ── 1. Билд Rust инсталлера под оба таргета ────────────────────────────────
  build-installer:
    name: Build installer (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            output: soft-updater-installer.exe
            artifact: soft-updater-installer-win-x64.exe
          - target: x86_64-unknown-linux-gnu
            output: soft-updater-installer
            artifact: soft-updater-installer-linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache apt (mingw)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-mingw-${{ runner.os }}

      - name: Install cross-compilation tools
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.INSTALLER_DIR }}/target
          key: rust-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Build
        working-directory: ${{ env.INSTALLER_DIR }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.INSTALLER_DIR }}/target/${{ matrix.target }}/release/${{ matrix.output }}
          retention-days: 1

  # ── 2. Билд и публикация .NET либы ────────────────────────────────────────
  publish-lib:
    name: Pack and publish NuGet
    runs-on: ubuntu-latest
    needs: build-installer
    permissions:
      packages: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Создаём папку для бинарников
      - name: Create Resources directory
        run: mkdir -p ${{ env.RESOURCES_DIR }}

      # Скачиваем оба бинарника из предыдущего джоба
      - name: Download win installer
        uses: actions/download-artifact@v4
        with:
          name: soft-updater-installer-win-x64.exe
          path: ${{ env.RESOURCES_DIR }}

      - name: Download linux installer
        uses: actions/download-artifact@v4
        with:
          name: soft-updater-installer-linux-x64
          path: ${{ env.RESOURCES_DIR }}

      - name: Make linux installer executable
        run: chmod +x ${{ env.RESOURCES_DIR }}/soft-updater-installer-linux-x64

      # Версия из тега (v1.2.3 → 1.2.3)
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Pack
        run: |
          dotnet pack ${{ env.LIB_PROJECT }} \
            --configuration Release \
            --output ./nupkg \
            /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./nupkg/*.nupkg
          generate_release_notes: true